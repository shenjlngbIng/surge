name: Install Surge package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract package
        run: |
          echo "7a2c8cb7a7214403b279cc8b3da65e647bf51b805e24000db321933ff6d30654  Surge-R12.14-release.zip" | sha256sum -c -
          unzip -q -o Surge-R12.14-release.zip
          sha256sum -c SHA256SUMS.txt

      - name: Commit installed files
        run: |
          rm -f Surge-R12.14-release.zip
          rm -f .github/workflows/install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Surge iOS Privacy + Push R12.14"
          git push origin HEAD:main

DOMAIN-SUFFIX,net.coffee,Privacy
DOMAIN-SUFFIX,ippure.com,Privacy
DOMAIN-SUFFIX,browserleaks.net,Privacy
DOMAIN-SUFFIX,surfsharkdns.com,Privacy
DOMAIN-SUFFIX,fastly-analytics.com,Privacy

DOMAIN-SUFFIX,qiniu.com,DIRECT
DOMAIN-SUFFIX,tencentcs.com,DIRECT
DOMAIN-SUFFIX,volccdn.com,DIRECT
DOMAIN-SUFFIX,volcengine.com,DIRECT
# Maintained domestic supplement; the original pinned China list remains below.
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT,extended-matching,no-resolve,update-interval=86400
# China domains · precise
DOMAIN-SET,https://cdn.jsdelivr.net/gh/shenjlngbIng/surge@2b8fa93901061cf0482b079203630bcd11bfe0b1/Rules/China.list,DIRECT,extended-matching,update-interval=-1
# Global domains · precise
DOMAIN-SET,https://cdn.jsdelivr.net/gh/shenjlngbIng/surge@2b8fa93901061cf0482b079203630bcd11bfe0b1/Rules/Global.list,Proxy,extended-matching,update-interval=-1

# Do not force local DNS for unmatched domain requests at the CN GeoIP boundary.
# Known domestic domains match above; unresolved names fall through to Final/Proxy
# for proxy-side resolution, while already resolved CN IP literals stay DIRECT.
GEOIP,CN,DIRECT,no-resolve
IP-CIDR,0.0.0.0/0,Proxy,no-resolve
IP-CIDR6,::/0,Proxy,no-resolve

# Final
FINAL,Final,dns-failed

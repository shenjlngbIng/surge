DOMAIN-SUFFIX,ipapi.co,Privacy
DOMAIN-SUFFIX,ipip.net,Privacy
IP-CIDR,1.1.1.1/32,Privacy,no-resolve

# DNS egress controls. Surge's own encrypted DNS bypasses rules because
# encrypted-dns-follow-outbound-mode=false; application-generated DoH/DoT does not.
DOMAIN,dns.alidns.com,Proxy
DOMAIN,dns.pub,Proxy
DOMAIN,doh.pub,Proxy
DOMAIN,dot.pub,Proxy
DOMAIN,dns.google,Proxy
DOMAIN,dns.360.cn,Proxy
DOMAIN,doh.360.cn,Proxy
DOMAIN,one.one.one.one,Proxy
DOMAIN,dns.nextdns.io,Proxy
DOMAIN,dns.adguard.com,Proxy

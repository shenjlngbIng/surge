HBO = url-test, Fail-Closed, include-other-group="America-Nodes,Singapore-Nodes,HongKong-Nodes,TaiWan-Nodes", policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
PrimeVideo = url-test, Fail-Closed, include-other-group="HongKong-Nodes,TaiWan-Nodes,Japan-Nodes,Singapore-Nodes,America-Nodes", policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
Emby = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
# TikTok：美、日、新、台，采用保守候选。
TikTok = url-test, Fail-Closed, include-other-group="America-Nodes,Japan-Nodes,Singapore-Nodes,TaiWan-Nodes", policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
# 巴哈：台湾片库取向。
Bahamut = url-test, Fail-Closed, include-other-group="TaiWan-Nodes", policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
Spotify = url-test, Fail-Closed, include-other-group="HongKong-Nodes,TaiWan-Nodes,Japan-Nodes,Singapore-Nodes,America-Nodes", policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
# 混合流媒体；地区例外由前置规则处理。
Streaming = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
Telegram = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
X = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
# Apple 默认直连；推送独立分流。
Apple = select, DIRECT, Proxy, HongKong, TaiWan, Japan, Singapore, America, Auto
Google = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
Microsoft = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true
Games = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true

# 唯一订阅；统一测速并启用 UDP 中继。
桔子 = select, REJECT, policy-path=https://example.invalid/REPLACE_WITH_SURGE_SUBSCRIPTION_URL, update-interval=3600, external-policy-modifier="udp-relay=true,test-url=http://cp.cloudflare.com/generate_204,test-timeout=5", hidden=1

# 手动节点池，默认 Auto。
NodePool = select, Auto, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+

# Smart 智能选点，保留空池哨兵。
Auto = smart, Fail-Closed, evaluate-before-use=true, include-other-group=桔子

# 最低测试延迟；300 秒后按需重测。
Fast = url-test, Fail-Closed, include-other-group=桔子, policy-regex-filter=^(?!REJECT$).+, interval=300, tolerance=0, evaluate-before-use=true, no-alert=true


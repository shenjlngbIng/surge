DOMAIN-SUFFIX,icanhazip.com,Proxy
DOMAIN-SUFFIX,ipinfo.io,Proxy
DOMAIN-SUFFIX,ipapi.co,Proxy
DOMAIN-SUFFIX,ipip.net,Proxy
IP-CIDR,1.1.1.1/32,Proxy,no-resolve

# Foreign application DNS egress remains proxied. Surge's own encrypted DNS
# bypasses these rules because encrypted-dns-follow-outbound-mode=false.
DOMAIN,dns.google,Proxy
DOMAIN,one.one.one.one,Proxy
DOMAIN,dns.nextdns.io,Proxy

# Global domains · precise
DOMAIN-SET,https://cdn.jsdelivr.net/gh/shenjlngbIng/surge@d1d714d575d5494ef1a7613238f4f301e1b293df/Rules/Global.list,Proxy,update-interval=-1

# Do not force local DNS for unmatched domain requests at the CN GeoIP boundary.
# Known domestic domains match above; unresolved names fall through to Final/Proxy
# for proxy-side resolution, while already resolved CN IP literals still use Domestic.
GEOIP,CN,Domestic,no-resolve
IP-CIDR,0.0.0.0/0,Proxy,no-resolve
IP-CIDR6,::/0,Proxy,no-resolve

# Final
FINAL,Final,dns-failed
